# Netlify 部署配置 - 运营端（Operation）

[build]
  command = "pnpm install && pnpm build:operation"
  publish = "dist-operation"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  VITE_SYSTEM_TYPE = "Operation"
  # Function 代理后端地址（也可在 Netlify UI 环境变量覆盖）
  API_BASE_URL = "http://47.84.135.181:8888"

[functions]
  # 增加函数请求体大小限制到 10MB
  included_files = ["netlify/functions/**"]
  # 注意: Netlify Functions 免费版最大支持 6MB 同步请求
  # 如果需要更大文件，考虑使用后台函数或直接上传到对象存储

[context.production]
  command = "pnpm install && pnpm build:operation"
  publish = "dist-operation"
  [context.production.environment]
    VITE_SYSTEM_TYPE = "Operation"

[context.develop]
  command = "pnpm install && pnpm build:operation"
  publish = "dist-operation"
  [context.develop.environment]
    VITE_SYSTEM_TYPE = "Operation"

[context.branch-deploy]
  command = "pnpm install && pnpm build:operation"
  publish = "dist-operation"
  [context.branch-deploy.environment]
    VITE_SYSTEM_TYPE = "Operation"

# 后端地址：与 API_BASE_URL 保持一致。优先直连代理（更稳、无 Function 冷启动/超时）
# 文件类资源
[[redirects]]
  from = "/v1/files/*"
  to = "http://47.84.135.181:8888/v1/files/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/v2/files/*"
  to = "http://47.84.135.181:8888/v2/files/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/files/*"
  to = "http://47.84.135.181:8888/files/:splat"
  status = 200
  force = true

# 业务 API 直连代理到后端（解决 captcha 等接口 502）
[[redirects]]
  from = "/v3/*"
  to = "http://47.84.135.181:8888/v3/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/v2/*"
  to = "http://47.84.135.181:8888/v2/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/v1/*"
  to = "http://47.84.135.181:8888/v1/:splat"
  status = 200
  force = true

# 重定向 /operation 路径的静态资源到根目录
[[redirects]]
  from = "/operation/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
