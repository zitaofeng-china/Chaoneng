# Netlify 部署配置 - 运营端（Operation）

[build]
  command = "pnpm install && pnpm build:operation"
  publish = "dist-operation"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  VITE_SYSTEM_TYPE = "Operation"

[functions]
  # 增加函数请求体大小限制到 10MB
  included_files = ["netlify/functions/**"]
  # 注意: Netlify Functions 免费版最大支持 6MB 同步请求
  # 如果需要更大文件，考虑使用后台函数或直接上传到对象存储

[context.production]
  command = "pnpm install && pnpm build:operation"
  publish = "dist-operation"
  [context.production.environment]
    VITE_SYSTEM_TYPE = "Operation"

[context.develop]
  command = "pnpm install && pnpm build:operation"
  publish = "dist-operation"
  [context.develop.environment]
    VITE_SYSTEM_TYPE = "Operation"

[context.branch-deploy]
  command = "pnpm install && pnpm build:operation"
  publish = "dist-operation"
  [context.branch-deploy.environment]
    VITE_SYSTEM_TYPE = "Operation"

# 代理静态文件访问（图片、视频等）- 必须放在 API 路由之前
[[redirects]]
  from = "/v1/files/*"
  to = "http://47.84.135.181:8888/v1/files/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/v2/files/*"
  to = "http://47.84.135.181:8888/v2/files/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/files/*"
  to = "http://47.84.135.181:8888/files/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/v3/*"
  to = "/.netlify/functions/api/v3/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/v2/*"
  to = "/.netlify/functions/api/v2/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/v1/*"
  to = "/.netlify/functions/api/v1/:splat"
  status = 200
  force = true

# 重定向 /operation 路径的静态资源到根目录
[[redirects]]
  from = "/operation/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
